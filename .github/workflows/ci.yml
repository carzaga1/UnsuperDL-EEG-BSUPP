# CI never fetches, mounts, or has access to real KISPI patient data -- tests
# run exclusively against synthetic fixtures generated in-process (see
# src/bscarlos/testing/synthetic_data.py), and the Docker build context
# excludes data/, references/, and notebooks/ via .dockerignore.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v --cov=bscarlos

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build CPU image
        run: docker build -f Dockerfile -t bscarlos:cpu .

      - name: Smoke test CPU image
        run: docker run --rm bscarlos:cpu --help

      # Build-only: GitHub-hosted runners have no GPU, so the CUDA image can't
      # actually be run here -- only confirmed to build successfully.
      - name: Build CUDA image
        run: docker build -f Dockerfile.cuda -t bscarlos:cuda .
